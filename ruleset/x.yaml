# ==============================================================================
# Mihomo (Clash.Meta) X (Twitter) & xAI (Grok) 分流规则集
# 规则集类型 (behavior): classical (同时包含域名规则与 IP-CIDR 规则)
# ==============================================================================

payload:
  # ----------------------------------------------------------------------------
  # 1. X (Twitter) 核心主站与短链接服务 (Core & Shortener)
  # ----------------------------------------------------------------------------
  - DOMAIN-SUFFIX,x.com # X (原 Twitter) 全球主站、移动端网页与核心 API 通信入口
  - DOMAIN-SUFFIX,twitter.com # Twitter 经典主域名，承载历史链接重定向、API 接口及后台长连接服务
  - DOMAIN-SUFFIX,t.co # X 官方短链接跳转服务，站内所有外链、推文图片与视频分享均强制经此域名跳转
  - DOMAIN-SUFFIX,tweetdeck.com # X Pro (原 TweetDeck) 专业多列推文管理工作台专用域名
  - DOMAIN-SUFFIX,twitter.biz # X 官方商业合作与企业服务入口域名

  # ----------------------------------------------------------------------------
  # 2. 图片、视频流媒体与静态资源 CDN (Media & Static CDN)
  # ----------------------------------------------------------------------------
  - DOMAIN-SUFFIX,twimg.com # X 核心多媒体 CDN，承载全站推文原图 (pbs.twimg.com)、视频流 (video.twimg.com) 及前端静态脚本 (abs.twimg.com)
  - DOMAIN-SUFFIX,twimg.co # X 静态图片与媒体分发备用域名
  - DOMAIN-SUFFIX,twttr.com # X 底层基础设施、反向 DNS 解析与内部 API 网关域名
  - DOMAIN-SUFFIX,twttr.net # X 边缘分发网络与底层内容传输辅助域名
  - DOMAIN-SUFFIX,cms-twdigitalassets.com # X 官方品牌视觉素材、帮助中心文档图片与政企数字资产托管 CDN
  - DOMAIN-SUFFIX,twitpic.com # 早期 Twitter 经典图片托管服务域名（由 X 官方维护历史图片归档跳转）

  # ----------------------------------------------------------------------------
  # 3. 实时音视频、语聊房 (Spaces) 与直播服务 (Live & Audio Spaces)
  # ----------------------------------------------------------------------------
  - DOMAIN-SUFFIX,pscp.tv # X Live 直播与 X Spaces（语聊房）底层实时音视频流传输核心域名
  - DOMAIN-SUFFIX,periscope.tv # Periscope 实时视频流媒体协议与互动弹幕服务域名（支撑 X 原生直播功能）
  - DOMAIN-SUFFIX,vine.co # Vine 短视频历史归档与循环视频媒体资源域名

  # ----------------------------------------------------------------------------
  # 4. xAI 与 Grok 人工智能服务 (xAI & Grok AI Ecosystem)
  # ----------------------------------------------------------------------------
  - DOMAIN-SUFFIX,x.ai # 马斯克旗下 xAI 人工智能实验室官网、API 开发者平台 (console.x.ai) 及文档中心
  - DOMAIN-SUFFIX,grok.com # Grok 人工智能助手独立网页版、移动客户端通信与实时语音交互主域名
  - DOMAIN-SUFFIX,grokipedia.com # xAI 旗下 Grokipedia 在线知识库与智能检索服务域名

  # ----------------------------------------------------------------------------
  # 5. 商业广告、状态监控与安全统计 (Ads, Status & Telemetry)
  # ----------------------------------------------------------------------------
  - DOMAIN-SUFFIX,ads-twitter.com # X Ads 官方广告投放管理平台与转化追踪脚本域名
  - DOMAIN-SUFFIX,tellapart.com # X 旗下电商重定向广告与营销数据分析子平台域名
  - DOMAIN-SUFFIX,twitterstat.us # X 官方全球服务器运行状态监控与故障公告页面域名
  - DOMAIN-KEYWORD,twitter # 匹配包含 twitter 关键字的其余衍生子域名与边缘认证节点

  # ----------------------------------------------------------------------------
  # 6. X (Twitter) 官方自治系统核心 IP 网段 (AS13414 / AS35995 / AS54888)
  # 说明：附加 no-resolve 参数防止代理客户端在匹配 IP 规则时发起多余本地 DNS 查询导致泄露
  # ----------------------------------------------------------------------------
  - IP-CIDR,104.244.40.0/21,no-resolve # X (AS13414) 最核心的前端 Anycast 接入网段 (104.244.40.0 ~ 104.244.47.255)，承载网页端与 App 实时连接
  - IP-CIDR,199.16.156.0/22,no-resolve # X 核心 API 网关与移动端数据同步服务器网段
  - IP-CIDR,199.59.148.0/22,no-resolve # X 全球主数据中心（旧金山/西雅图等）核心前端与短链接解析网段
  - IP-CIDR,199.96.56.0/21,no-resolve # X 全球边缘计算节点、推送通知与实时消息传输网段
  - IP-CIDR,192.133.76.0/22,no-resolve # X 媒体上传处理与后端基础设施专用网段
  - IP-CIDR,69.195.160.0/19,no-resolve # X 大规模数据中心集群与直播流媒体分发网段
  - IP-CIDR,209.237.192.0/19,no-resolve # X 骨干网路由与跨区域数据中心互联 IP 网段
  - IP-CIDR,202.160.128.0/22,no-resolve # X 亚太地区 (APAC) 边缘接入与高速缓存节点网段
  - IP-CIDR,103.252.112.0/22,no-resolve # X 亚太及全球扩展边缘接入网段 (涵盖 103.252.112.0/23 与 103.252.114.0/23)
  - IP-CIDR,185.45.4.0/22,no-resolve # X 欧洲地区 (EMEA) 核心数据中心与边缘接入网段
  - IP-CIDR,192.48.236.0/23,no-resolve # X 专用网络服务与安全验证基础设施网段
  - IP-CIDR6,2620:101:8000::/40,no-resolve # X (AS13414) 北美及全球主干网 IPv6 核心服务地址块
  - IP-CIDR6,2a01:5740::/32,no-resolve # X 欧洲及全球边缘节点 IPv6 核心服务地址块
